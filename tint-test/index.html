<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ef4c3c">
<title>Tab color test</title>
<style>
  html, body { margin: 0; min-height: 100%; font: 600 18px/1.4 system-ui, sans-serif; color: #fff; }
  body { padding: 40px; }
  a { display: inline-block; margin: 6px; padding: 12px 16px; border-radius: 999px; background: rgba(0,0,0,.25); color: #fff; text-decoration: none; }
  h1 { font-size: 34px; margin: 0 0 8px; }
</style>
<script>
  // Temporary page for checking which colors Safari puts in its tab bar. Each link loads one color fresh.
  const p = new URLSearchParams(location.search), c = '#' + (p.get('c') || 'ef4c3c');
  document.querySelector('meta[name="theme-color"]').content = c;
  document.documentElement.style.background = c;
</script>
</head>
<body>
<h1 id="h"></h1>
<p>Each row goes from the real flavor color (1) to darker shades (2, 3, 4). Click each one and note which turn the top of Safari that color.</p>
<p><a href="?c=ef4c3c">Fudge red (works)</a></p>
<p>Blue: <a href="?c=1497ec" style="background:#1497ec">B1</a> <a href="?c=118ad7" style="background:#118ad7">B2</a> <a href="?c=107abf" style="background:#107abf">B3</a> <a href="?c=10669f" style="background:#10669f">B4</a></p>
<p>Orange: <a href="?c=f39c1e" style="background:#f39c1e">O1</a> <a href="?c=b97615" style="background:#b97615">O2</a> <a href="?c=a46911" style="background:#a46911">O3</a> <a href="?c=895710" style="background:#895710">O4</a></p>
<p>Green: <a href="?c=4fc690" style="background:#4fc690">G1</a> <a href="?c=3d966e" style="background:#3d966e">G2</a> <a href="?c=33825f" style="background:#33825f">G3</a> <a href="?c=2c6c4f" style="background:#2c6c4f">G4</a></p>

<script>document.getElementById('h').textContent = 'Showing ' + c;</script>
</body>
</html>
