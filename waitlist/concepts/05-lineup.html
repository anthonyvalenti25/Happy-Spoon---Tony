<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b140e" data-fixed>
  <meta name="robots" content="noindex">
  <title>05 Lineup | Happy Spoon waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
  <link rel="stylesheet" href="shared.css?v=3">
  <style>
    /* Lineup: all five wait on a shelf. Each takes its turn leaping up to center stage, then hops back into line. */

    /* Phone frame: a fixed chocolate-brown frame with the flavor color as a rounded panel inside.
       iOS Safari picks its toolbar color once at load, so the toolbars load brown and blend into the frame. */
    :root { --frame: #2b140e; --cream: #f7ecdd; }
    html, body { background: var(--frame); }
    .app { --top: max(env(safe-area-inset-top), 10px); --band: max(env(safe-area-inset-bottom), 10px);
      padding-top: var(--top); padding-bottom: calc(var(--band) + 18px); }
    .app::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0;
      top: calc(var(--top) + 66px); bottom: var(--band); border-radius: 28px; background: var(--bg); }
    .top { color: var(--cream); height: 58px; }
    .top .wordmark { width: 84px; }
    .top .chip { background: rgba(247, 236, 221, .12); }
    .bars { margin-top: 22px; }
    .tub { transform-origin: 50% 100%; }
    .halo {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--glow) 85%, var(--bg)), color-mix(in srgb, var(--glow) 35%, var(--bg)) 70%);
      box-shadow: inset 0 -30px 60px -30px color-mix(in srgb, var(--deep) 60%, transparent);
    }
    .halo.pulse { animation: pulse 1.1s var(--ease); }
    @keyframes pulse { 40% { transform: scale(.94); } 70% { transform: scale(1.025); } }

    /* The shelf. ?shelf=glass (default) | ledge | risers | floor picks a style for comparison. */
    .shelf { position: absolute; top: 0; left: -18px; width: calc(100% + 36px); height: 100%; pointer-events: none; z-index: 1; }
    .shelf > * { position: absolute; }
    .face { left: 0; right: 0; overflow: hidden; }
    .edge, .under { left: 0; right: 0; }
    .refl { position: absolute; opacity: .32; transform: scaleY(-1); transition: opacity .35s ease .8s;
      -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 38%); mask-image: linear-gradient(to top, #000 0%, transparent 38%); }
    .cshadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.32), rgba(0,0,0,0)); transition: opacity .35s ease .8s; }
    .gone { opacity: 0 !important; transition-delay: 0s !important; }

    /* Glass: a clear ledge that reflects the tubs, with a bright front edge */
    [data-shelf="glass"] .face { background: linear-gradient(rgba(255,255,255,.05), rgba(255,255,255,.22)); }
    [data-shelf="glass"] .edge { background: linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.22)); }
    [data-shelf="glass"] .under { background: radial-gradient(60% 100% at 50% 0, rgba(0,0,0,.2), transparent); }

    /* Ledge: a solid display shelf, lit from underneath */
    [data-shelf="ledge"] .face { background: linear-gradient(color-mix(in srgb, var(--glow) 55%, var(--bg)), color-mix(in srgb, var(--glow) 80%, #fff)); }
    [data-shelf="ledge"] .edge { background: linear-gradient(var(--deep), color-mix(in srgb, var(--deep) 75%, #000)); }
    [data-shelf="ledge"] .under { background: radial-gradient(55% 100% at 50% 0, color-mix(in srgb, var(--glow) 90%, #fff), transparent); opacity: .8; }
    [data-shelf="ledge"] .refl { display: none; }

    /* Risers: each flavor waits on its own little pedestal */
    .riser { border-radius: 0 0 50% 50% / 0 0 9px 9px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--deep) 70%, #000), var(--deep) 30%, color-mix(in srgb, var(--glow) 40%, var(--deep)) 55%, var(--deep) 75%, color-mix(in srgb, var(--deep) 70%, #000)); }
    .riser::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--glow) 70%, var(--bg)); }
    [data-shelf="risers"] .refl { display: none; }

    /* Floor: no shelf, just a glossy floor that reflects */
    [data-shelf="floor"] .face { background: linear-gradient(transparent, color-mix(in srgb, var(--deep) 80%, transparent) 30%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
    [data-shelf="floor"] .refl { opacity: .4; }

    /* Desktop: text and form on the left, the stage on the right, color edge to edge */
    @media (min-width: 900px) and (orientation: landscape) {
      html, body { background: var(--bg); }
      .app::before { display: none; }
      .top { color: var(--ink); }
      .top .chip { background: color-mix(in srgb, var(--ink) 14%, transparent); }
      .app {
        max-width: 1440px; column-gap: clamp(32px, 4vw, 72px);
        padding: 24px clamp(32px, 4.5vw, 72px) 28px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr);
        grid-template-rows: auto 1fr auto auto 1fr;
        grid-template-areas: "top top" ". stage" "bars stage" "bottom stage" ". stage";
      }
      .top { grid-area: top; height: 56px; }
      .top .wordmark { width: 128px; }
      .chip { font-size: 12px; padding: 8px 14px; }
      .stage { grid-area: stage; margin-top: 12px; }
      .bars { grid-area: bars; max-width: 420px; margin: 0 0 22px; }
      .bottom { grid-area: bottom; max-width: 640px; container-type: inline-size; }
      .eyebrow { font-size: 13px; }
      .name { font-size: min(11.8cqi, 96px); margin-top: 10px; }   /* longest name fills the column */
      .offer { font-size: 20px; margin-top: 16px; }
      .join { margin-top: 26px; max-width: 520px; padding: 6px; }
      .join input { font-size: 17px; padding: 0 18px; }
      .join button { padding: 18px 24px; font-size: 16px; }
      .done-msg { max-width: 520px; margin-top: 26px; }
      .note { text-align: left; padding-left: 20px; max-width: 520px; }
      .tub { cursor: pointer; }
      .shelf { left: -48px; width: calc(100% + 48px + clamp(32px, 4.5vw, 72px));
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 140px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, transparent, #000 140px, #000 calc(100% - 48px), transparent); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><span class="wordmark" role="img" aria-label="Happy Spoon"></span><span class="chip">Launching soon</span></header>
    <nav class="bars" aria-label="Flavors"></nav>
    <section class="stage" id="stage" aria-hidden="true"></section>
    <section class="bottom">
      <p class="eyebrow">High-protein dessert yogurt</p>
      <h1 class="name"></h1>
      <p class="offer">Join the waitlist and get a <b>free 32&nbsp;oz tub</b> when we launch.</p>
      <form class="join" novalidate><label class="sr" for="email">Email address</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email"><button type="submit">Get my free tub</button></form>
      <div class="done-msg" role="status"><b>You're on the list.</b>We'll email you at launch about your free 32&nbsp;oz tub.</div>
      <p class="note" aria-live="polite"></p>
    </section>
  </main>
  <script src="shared.js?v=5"></script>
  <script>
    const stage = document.getElementById('stage');
    const STYLE = ['glass', 'ledge', 'risers', 'floor'].find(v => v === new URLSearchParams(location.search).get('shelf')) || 'glass';
    document.body.dataset.shelf = STYLE;
    const halo = document.createElement('div'); halo.className = 'halo';
    const shelf = document.createElement('div'); shelf.className = 'shelf';
    const face = document.createElement('div'); face.className = 'face';
    const edge = document.createElement('div'); edge.className = 'edge';
    const under = document.createElement('div'); under.className = 'under';
    if (STYLE === 'glass' || STYLE === 'ledge') shelf.append(under, face, edge);
    if (STYLE === 'floor') shelf.append(face);
    stage.append(halo, shelf);
    // Per-flavor extras that stay on the shelf: a reflection, a contact shadow, and (risers) a pedestal
    const refls = HS.FLAVORS.map(f => { const r = document.createElement('img'); r.className = 'refl'; r.src = HS.src(f); r.alt = ''; face.append(r); return r; });
    const shadows = HS.FLAVORS.map(() => { const d = document.createElement('div'); d.className = 'cshadow'; shelf.append(d); return d; });
    const risers = STYLE === 'risers' ? HS.FLAVORS.map(() => { const d = document.createElement('div'); d.className = 'riser'; shelf.prepend(d); return d; }) : [];
    const tubs = HS.FLAVORS.map((f, k) => { const t = HS.tub(f); t.dataset.flavor = k; stage.append(t); return t; });

    let W, H, tw, th, hero = 0, spots = [], heroSpot;
    // A spot is where a tub's bottom center sits, plus its scale relative to the hero size.
    const tf = p => `translate(${p.x - tw / 2}px, ${p.y - th}px) scale(${p.s})`;
    const px = n => `${n}px`;
    function layout() {
      W = stage.clientWidth; H = stage.clientHeight;
      const pad = Math.max(8, W * 0.03), sw = (W - pad * 4) / 5, stw = sw * 0.92, sth = stw * 1.2;
      const below = { glass: 44, ledge: 46, risers: 34, floor: 30 }[STYLE];
      const shelfY = H - below;
      const heroRoom = shelfY - sth - 26;
      th = Math.min(heroRoom * 0.94, W * (W > 500 ? 0.74 : 0.6) * 1.2); tw = th / 1.2;   // bigger hero on desktop
      const heroY = Math.min(heroRoom, heroRoom / 2 + th / 2 + 6);
      heroSpot = { x: W / 2, y: heroY, s: 1 };
      spots = HS.FLAVORS.map((_, k) => ({ x: sw / 2 + k * (sw + pad), y: shelfY, s: stw / tw }));
      tubs.forEach(t => { t.style.width = px(tw); });

      // Shelf parts, in shelf coordinates (the shelf bleeds past the stage edges)
      const off = -shelf.offsetLeft;
      const faceTop = STYLE === 'floor' ? shelfY - 8 : shelfY - 13, faceH = STYLE === 'floor' ? H - faceTop + 14 : STYLE === 'glass' ? 32 : 22;
      Object.assign(face.style, { top: px(faceTop), height: px(faceH) });
      Object.assign(edge.style, { top: px(faceTop + faceH), height: px(STYLE === 'ledge' ? 14 : 6) });
      Object.assign(under.style, { top: px(faceTop + faceH + (STYLE === 'ledge' ? 14 : 6)), height: px(30) });
      spots.forEach((p, k) => {
        Object.assign(refls[k].style, { left: px(p.x + off - stw / 2), top: px(shelfY - faceTop - 2), width: px(stw), height: px(sth) });
        Object.assign(shadows[k].style, { left: px(p.x + off - stw * 0.55), top: px(shelfY - 7), width: px(stw * 1.1), height: px(14) });
        if (risers[k]) Object.assign(risers[k].style, { left: px(p.x + off - stw * 0.5), top: px(shelfY - 3), width: px(stw), height: px(below - 4) });
      });
      const d = Math.min(th * 1.02, W * 0.92);
      Object.assign(halo.style, { left: px(W / 2 - d / 2), top: px(heroY - th / 2 - d / 2 - th * 0.02), width: px(d), height: px(d) });
      place();
    }
    function mark() {
      refls.forEach((r, k) => r.classList.toggle('gone', k === hero));
      shadows.forEach((d, k) => d.classList.toggle('gone', k === hero));
    }
    function place() {
      tubs.forEach((t, k) => {
        t.getAnimations().forEach(a => a.cancel());
        t.style.transform = tf(k === hero ? heroSpot : spots[k]);
        t.style.zIndex = k === hero ? 3 : 2;
      });
      mark();
    }
    // Fly along an arc rather than a straight line.
    function fly(t, a, b, delay, lift) {
      const mid = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift, s: (a.s + b.s) / 2 };
      return t.animate([{ transform: tf(a) }, { transform: tf(mid), offset: .45 }, { transform: tf(b) }],
        { duration: 1000, delay, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'backwards' });
    }

    layout();
    HS.start({
      stage, paintDelay: 350,
      onChange(i, prev) {
        if (i === prev || HS.reduced) { hero = i; place(); return; }
        place();
        hero = i;
        const up = tubs[i], down = tubs[prev];
        up.style.transform = tf(heroSpot); up.style.zIndex = 4;
        down.style.transform = tf(spots[prev]); down.style.zIndex = 3;
        mark();
        fly(down, heroSpot, spots[prev], 0, th * 0.12);
        fly(up, spots[i], heroSpot, 180, th * 0.18);
        halo.classList.remove('pulse'); void halo.offsetWidth; halo.classList.add('pulse');
      }
    });
    new ResizeObserver(() => layout()).observe(stage);
  </script>
</body>
</html>
