<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef4c3c">
  <meta name="robots" content="noindex">
  <title>02 Horizon | Happy Spoon waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
  <link rel="stylesheet" href="shared.css?v=1">
  <style>
    /* Horizon: the tubs stand on a giant turning planet. Each one rises over the horizon like a sunrise. */
    .stage { overflow: visible; }
    .tub { transform-origin: 50% 100%; }
    .planet {
      position: absolute; border-radius: 50%; will-change: transform;
      background:
        repeating-conic-gradient(from 0deg, rgba(255,255,255,.055) 0 18deg, rgba(255,255,255,0) 18deg 36deg),
        radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--glow) 55%, var(--deep)) 0%, var(--deep) 28%, color-mix(in srgb, var(--deep) 70%, #000) 70%);
      box-shadow: 0 -2px 0 rgba(255,255,255,.22);
    }
    .sun {
      position: absolute; border-radius: 50%; pointer-events: none;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 90%, transparent) 0%, color-mix(in srgb, var(--glow) 40%, transparent) 55%, transparent 100%);
      animation: rise 1.4s var(--ease) both;
    }
    @keyframes rise { from { transform: translateY(30%) scale(.7); opacity: 0; } }
    .app { overflow: hidden; }
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><span class="wordmark" role="img" aria-label="Happy Spoon"></span><span class="chip">Launching soon</span></header>
    <nav class="bars" aria-label="Flavors"></nav>
    <section class="stage" id="stage" aria-hidden="true"></section>
    <section class="bottom">
      <p class="eyebrow">High-protein dessert yogurt</p>
      <h1 class="name"></h1>
      <p class="sub">Five dessert flavors, made high-protein. Get first access at launch.</p>
      <form class="join" novalidate><label class="sr" for="email">Email address</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email"><button type="submit">Join the waitlist</button></form>
      <div class="done-msg" role="status"><b>You're on the list.</b>We'll email you before launch.</div>
      <p class="note" aria-live="polite"></p>
    </section>
  </main>
  <script src="shared.js?v=2"></script>
  <script>
    const stage = document.getElementById('stage');
    const SLOTS = 10, STEP = 360 / SLOTS;            // two laps of the five flavors around the planet
    const sun = document.createElement('div'); sun.className = 'sun';
    const planet = document.createElement('div'); planet.className = 'planet';
    stage.append(sun, planet);
    const tubs = Array.from({ length: SLOTS }, (_, j) => {
      const k = j % HS.N, t = HS.tub(HS.FLAVORS[k]);
      t.dataset.flavor = k; stage.append(t); return t;
    });

    let pos = 0, W, H, tw, th, R, cx, horizon, cancel = () => {};
    function layout() {
      W = stage.clientWidth; H = stage.clientHeight; cx = W / 2;
      th = Math.min(H * 0.7, W * 0.62 * 1.2); tw = th / 1.2;
      R = Math.max(W * 0.78, 290);
      horizon = Math.min(H - 8, th + (H - th) * 0.62);
      tubs.forEach(t => { t.style.width = `${tw}px`; });
      Object.assign(planet.style, { left: `${cx - R}px`, top: `${horizon}px`, width: `${R * 2}px`, height: `${R * 2}px` });
      const sw = tw * 2.3, sh = th * 1.5;
      Object.assign(sun.style, { left: `${cx - sw / 2}px`, top: `${horizon - sh * 0.62}px`, width: `${sw}px`, height: `${sh}px` });
      render();
    }
    function render() {
      const Cy = horizon + R;
      tubs.forEach((t, j) => {
        let a = (j - pos) * STEP;
        a = ((a + 180) % 360 + 360) % 360 - 180;
        const off = Math.abs(a) > 75;
        t.style.visibility = off ? 'hidden' : 'visible';
        if (off) return;
        const r = a * Math.PI / 180, near = Math.min(1, Math.abs(a) / STEP);
        const s = 1 - 0.3 * near;
        const x = cx + R * Math.sin(r), y = Cy - R * Math.cos(r);
        t.style.transform = `translate(${x - tw / 2}px, ${y - th * 0.97}px) rotate(${a}deg) scale(${s})`;
        t.style.zIndex = 10 - Math.round(near * 5);
        t.dataset.dir = a > 0 ? 1 : -1;
      });
      planet.style.transform = `rotate(${-pos * STEP}deg)`;
    }

    layout();
    HS.start({
      stage,
      onChange(i, prev, dir) {
        const steps = dir >= 0 ? HS.mod(i - prev) : -HS.mod(prev - i);
        const from = pos, to = Math.round(pos) + steps;
        cancel();
        cancel = HS.tween(from, to, 1300, v => { pos = v; render(); });
        sun.style.animation = 'none'; void sun.offsetWidth; sun.style.animation = '';
      }
    });
    new ResizeObserver(() => layout()).observe(stage);
  </script>
</body>
</html>
