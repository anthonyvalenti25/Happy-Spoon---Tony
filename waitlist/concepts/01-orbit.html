<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#ef4c3c">
  <meta name="robots" content="noindex">
  <title>01 Orbit | Happy Spoon waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
  <link rel="stylesheet" href="shared.css?v=2">
  <style>
    /* Orbit: the five tubs ride a turntable. The front of the ring is the stage. */
    .tub { transform-origin: 50% 100%; }
    .tub::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -3%; height: 8%; border-radius: 50%; background: rgba(0,0,0,.28); filter: blur(6px); z-index: -1; }
    .disc {
      position: absolute; border-radius: 50%;
      background: radial-gradient(120% 140% at 50% 15%, color-mix(in srgb, var(--glow) 70%, var(--bg)) 0%, var(--deep) 62%);
      box-shadow: 0 12px 0 color-mix(in srgb, var(--deep) 72%, #000), 0 44px 50px -18px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><span class="wordmark" role="img" aria-label="Happy Spoon"></span><span class="chip">Launching soon</span></header>
    <nav class="bars" aria-label="Flavors"></nav>
    <section class="stage" id="stage" aria-hidden="true"></section>
    <section class="bottom">
      <p class="eyebrow">High-protein dessert yogurt</p>
      <h1 class="name"></h1>
      <p class="offer">Join the waitlist and get a <b>free 32&nbsp;oz tub</b> when we launch.</p>
      <form class="join" novalidate><label class="sr" for="email">Email address</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email"><button type="submit">Get my free tub</button></form>
      <div class="done-msg" role="status"><b>You're on the list.</b>We'll email you at launch about your free 32&nbsp;oz tub.</div>
      <p class="note" aria-live="polite"></p>
    </section>
  </main>
  <script src="shared.js?v=9"></script>
  <script>
    const stage = document.getElementById('stage');
    const disc = document.createElement('div');
    disc.className = 'disc';
    stage.append(disc);
    const tubs = HS.FLAVORS.map((f, k) => { const t = HS.tub(f); t.dataset.flavor = k; stage.append(t); return t; });

    let pos = 0, W = 0, H = 0, tw = 0, th = 0, cancel = () => {};
    function layout() {
      W = stage.clientWidth; H = stage.clientHeight;
      tw = Math.min(W * 0.6, (H * 0.58) / 1.2); th = tw * 1.2;
      tubs.forEach(t => { t.style.width = `${tw}px`; });
      render();
    }
    function render() {
      const cx = W / 2, Rx = W * 0.36, lift = Math.min(H * 0.3, th * 0.62), baseY = Math.min(H - 24, H / 2 + th / 2 + lift * 0.2);
      tubs.forEach((t, k) => {
        const a = (k - pos) * 2 * Math.PI / HS.N;
        const d = (Math.cos(a) + 1) / 2;               // 1 = front of the ring, 0 = back
        const s = 0.38 + 0.62 * Math.pow(d, 1.7);
        const x = cx + Math.sin(a) * Rx, y = baseY - (1 - d) * lift;
        t.style.transform = `translate(${x - tw / 2}px, ${y - th}px) scale(${s})`;
        t.style.opacity = 0.5 + 0.5 * d;
        t.style.zIndex = Math.round(d * 100);
        t.dataset.dir = Math.sin(a) > 0 ? 1 : -1;
      });
      const rx = Rx + tw * 0.5, ry = lift / 2 + th * 0.07;
      Object.assign(disc.style, { left: `${cx - rx}px`, top: `${baseY - lift / 2 - ry}px`, width: `${rx * 2}px`, height: `${ry * 2}px` });
    }

    layout();
    HS.start({
      stage,
      onChange(i, prev, dir) {
        const steps = dir >= 0 ? HS.mod(i - prev) : -HS.mod(prev - i);
        const from = pos, to = Math.round(pos) + steps;
        cancel();
        cancel = HS.tween(from, to, 1150, v => { pos = v; render(); });
      }
    });
    new ResizeObserver(() => layout()).observe(stage);
  </script>
</body>
</html>
